plugins {
    id 'org.jetbrains.intellij' version '1.17.4'
    id 'java'
    id 'org.jetbrains.kotlin.jvm'
}

group 'tech.lin2j'
version '1.3.9-242'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.hierynomus:sshj:0.39.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.2'
    testImplementation 'org.junit.vintage:junit-vintage-engine:5.8.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}

// See https://github.com/JetBrains/gradle-intellij-plugin/
intellij {
    version = '2024.1'
    type = 'IU'
    plugins = [
            'com.intellij.java',
            "org.jetbrains.plugins.terminal",
    ]
    updateSinceUntilBuild = false
}

// Disable plugin update checks (fails when GitHub API is unreachable)
tasks.named('initializeIntelliJPlugin') {
    enabled = false
}

// Disable searchable options build (requires coroutines-javaagent from initializeIntelliJPlugin)
tasks.named('buildSearchableOptions') {
    enabled = false
}

// Disable instrumentCode if forms instrumentation isn't needed
// This fixes compatibility issues with IJ 2024.1 and plugin 1.17.4
tasks.named('instrumentCode') {
    enabled = false
}
tasks.named('instrumentTestCode') {
    enabled = false
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xlint:unchecked"
    options.release = 17
}

test {
    useJUnitPlatform()
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
